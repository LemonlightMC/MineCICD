# Secrets store. This file lives in the server root and is never tracked by git
# (the plugin-managed .gitignore ignores /secrets.yml).
# For each file, create a block with a unique index. Each block needs a file path
# (relative to the server root). The keys are the placeholder tokens that appear in
# the tracked (committed) file; the values are the real secrets. On commit/pull the
# plugin's pure-Java git filter swaps values with placeholders (clean) and placeholders
# back to values (smudge), so the repository never contains the real secrets.
1:
  file: "plugins/example-plugin-1/config.yml"
  database_password: "password"
  database_username: "username"
2:
  file: "plugins/example-plugin-2/config.yml"
  license_key: "license_key"