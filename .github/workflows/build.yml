name: Build

on:
  push:
    branches: ["master", "main"]
    paths:
      - "src/**"
      - "templates/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "action.yml"
      - ".github/workflows/**"
  pull_request:
    branches: ["master", "main"]
    paths:
      - "src/**"
      - "templates/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "action.yml"
      - ".github/workflows/**"
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
      - name: Cache Gradle
        uses: actions/cache@v6 # https://github.com/actions/cache/releases
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
            
      - name: Build with Gradle
        run: ./gradlew build
      - name: Verify JAR contains required resources
        # Clean-checkout assertion: the packaged plugin must contain its runtime
        # defaults so a CI-built artifact is usable (S-03). The fat jar is
        # selected explicitly - the `thin` jar would also match a plain glob.
        shell: bash
        run: |
          jar=$(find build/libs -maxdepth 1 -name 'MineCICD-*.jar' ! -name '*-thin.jar' | head -n 1)
          if [ -z "$jar" ]; then
            echo "No MineCICD fat jar found in build/libs" >&2
            exit 1
          fi
          for f in config.yml plugin.yml messages.yml example_script.sh secrets.yml; do
            if ! unzip -l "$jar" | grep -q " $f$"; then
              echo "Missing required resource in $jar: $f" >&2
              exit 1
            fi
          done
          echo "All required resources present in $jar"
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: MineCICD
          path: build/libs/MineCICD.jar
          if-no-files-found: error
          archive: false
          retention-days: 7

  release:
    name: Upload to release
    needs: build
    if: github.event_name == 'release' && github.repository == 'Bruderjulian/MineCICD'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build with Gradle
        run: ./gradlew shadowJar --no-daemon
      - name: Verify JAR contains required resources
        shell: bash
        run: |
          jar=$(find build/libs -maxdepth 1 -name 'MineCICD-*.jar' ! -name '*-thin.jar' | head -n 1)
          if [ -z "$jar" ]; then
            echo "No MineCICD fat jar found in build/libs" >&2
            exit 1
          fi
          for f in config.yml plugin.yml messages.yml example_script.sh secrets.yml; do
            if ! unzip -l "$jar" | grep -q " $f$"; then
              echo "Missing required resource in $jar: $f" >&2
              exit 1
            fi
          done
          echo "All required resources present in $jar"
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/MineCICD-*.jar
          fail_on_unmatched_files: true
