# Configuration for messages sent when commands / events are processed
# Messages are MiniMessage (https://docs.advntr.dev/minimessage/format.html)
# Legacy '&' color codes from older versions are migrated to MiniMessage automatically on load.
# Placeholders like {error} or {label} are replaced with their runtime value.
prefix: "<gray>[<green>Mine<aqua>CI<light_purple>CD<gray>] <reset>"

no-permission: "<red>You do not have permission to use this command."
busy: "<red>The plugin is currently processing another command."

reload-usage: "<red>Invalid arguments. Usage: /{label} reload"
reload-failed: "<red>Error reloading: {error}"
reload-success: "<green>Configuration, messages, control API, and secrets reloaded successfully."

init-usage: "<red>Invalid arguments. Usage: /{label} init"
init-failed: "<red>Error initializing the repository: {error}"
init-success: "<green>Repository initialized successfully. Use '/{label} add' to track files and '/{label} push' to upload them."
init-already-initialized: "<green>Repository is already initialized."

deinit-usage: "<red>Invalid arguments. Usage: /{label} deinit"
deinit-failed: "<red>Error deinitializing the repository: {error}"
deinit-success: "<green>Repository deinitialized successfully. The remote repository is not affected."
deinit-not-initialized: "<yellow>Repository is not initialized."

pull-usage: "<red>Invalid arguments. Usage: /{label} pull [force]"
pull-failed: "<red>Error pulling repo: {error}"
pull-aborted: "<red>There are unpushed changes in the repository. Please push these changes, undo them, or overwrite with '/{label} pull force'."
pull-success: "<green>All changes have been pulled successfully."
pull-no-changes: "<green>No changes to pull."
pull-change: "<gray>- <green>{change}"
pull-repo-not-initialized: "<red>Repository isn't set up yet. Run '/{label} pull' to initialize the repository from {repo} (branch: {branch})."

push-usage: "<red>Invalid arguments. Usage: /{label} push <commit message>"
push-failed: "<red>Error pushing repo: {error}"
push-success: "<green>Repo changes pushed successfully."
push-no-changes: "<green>No changes to push."

add-usage: "<red>Invalid arguments. Usage: /{label} add <file / 'directory/'> (trailing slash is required for directories)"
add-failed: "<red>Error adding file(s): {error}"
add-success: "<green>Added {amount} new file(s) to Git tracking."

remove-usage: "<red>Invalid arguments. Usage: /{label} remove <file / 'directory/'> (trailing slash is required for directories)"
remove-failed: "<red>Error removing file(s): {error}"
remove-success: "<green>Removed {amount} file(s) from Git tracking."

reset-usage: "<red>Invalid arguments. Usage: /{label} reset <commit hash / link>"
reset-failed: "<red>Error resetting: {error}"
reset-success: "<green>Reset successfully."
reset-invalid-commit: "<red>Invalid commit hash / link. Usage: /{label} reset <commit hash / link>"

rollback-usage: "<red>Invalid arguments. Usage: /{label} rollback <dd.MM.yyyy HH:mm:ss>"
rollback-invalid-date: "<red>Invalid date format. Usage: /{label} rollback <dd.MM.yyyy HH:mm:ss>"
rollback-future-date: "<red>Invalid date (Is in future). Usage: /{label} rollback <dd.MM.yyyy HH:mm:ss>"
rollback-failed: "<red>Error rolling back: {error}"
rollback-success: "<green>Rolled back successfully."

revert-usage: "<red>Invalid arguments. Usage: /{label} revert <commit hash / link>"
revert-failed: "<red>Error reverting: {error}"
revert-success: "<green>Reverted successfully."

log-usage: "<red>Invalid arguments. Usage: /{label} log <page / commit hash / link>"
log-invalid-commit: "<red>Invalid commit hash / link. Usage: /{label} log <page / commit hash / link>"
log-failed: "<red>Error getting log: {error}"
log-single-commit:
  - "<gray>===== <green>Commit <gray>====="
  - "<gray>Revision: <green>{revision}"
  - "<gray>Author: <green>{author}"
  - "<gray>Date: <green>{date}"
  - "<gray>===== <green>Message <gray>====="
  - "<gray>{message}"
  - "<gray>===== <green>Changes <gray>====="
  - "<gray>{changes}"
  - "<gray>====================="
log-list-header: "<gray>===== <green>Git log <gray>(<green>{page} <gray>/ <green>{maxPage}<gray>) ====="
log-list-line: "<green>{date}<gray>: <green>{revision} <gray>- (<green>{author}<gray>) {message}"
log-list-end: "<gray>===== End of page ====="

script-usage: "<red>Invalid arguments. Usage: /{label} script <script name>"
script-error-console: "<red>Error running script '{script}' line {line} (Command: {command}): {error}"
script-failed: "<red>Error running script: {error}"
script-success: "<green>Script ran successfully."

invalid-subcommand: "<red>Unknown command. Use /{label} help for a list of commands."
help:
  - "<green>/{label} init <gray>- <aqua>Initializes the local repository (no pull or push)."
  - "<green>/{label} deinit <gray>- <aqua>Removes the local repository (no pull or push)."
  - "<green>/{label} pull <gray>- <aqua>Pulls the latest changes from the remote or sets up the local repository if run for the first time."
  - "<green>/{label} push <commit message> <gray>- <aqua>Pushes the latest changes to the remote."
  - "<green>/{label} add <file / 'directory/'> <gray>- <aqua>Adds a file or directory to the repository."
  - "<green>/{label} remove <file / 'directory/'> <gray>- <aqua>Removes a file or directory from the repository."
  - "<green>/{label} reset <commit hash / link> <gray>- <aqua>Hard resets the current branch to the specified commit. (Commits will not be reverted)"
  - "<green>/{label} rollback <dd.MM.yyyy HH:mm:ss> <gray>- <aqua>Hard resets the current branch to the latest commit before the specified date. (Commits will not be reverted)"
  - "<green>/{label} revert <commit hash / link> <gray>- <aqua>Attempts to revert a specific commits changes."
  - "<green>/{label} script <script name> <gray>- <aqua>Runs a script from the scripts folder."
  - "<green>/{label} log <page / commit hash / link> <gray>- <aqua>Shows the commits made on the current branch."
  - "<green>/{label} status <gray>- <aqua>Shows the current status of the plugin, repository, control API, and changes."
  - "<green>/{label} resolve <merge-abort / repo-reset / reset-local-changes> <gray>- <aqua>Resolves conflicts by either aborting the merge, resetting the repository, or removing local changes."
  - "<green>/{label} diff <local / remote> <gray>- <aqua>Shows uncommited changes (local) or unpulled changes on the remote branch (remote)."
  - "<green>/{label} audit [page] <gray>- <aqua>Shows the audit log (who did what)."
  - "<green>/{label} analytics [reset] <gray>- <aqua>Shows deployment analytics or resets them."
  - "<green>/{label} confirm <approvalId> <gray>- <aqua>Confirms a pending change preview and applies it."
  - "<green>/{label} cancel <approvalId> <gray>- <aqua>Cancels a pending change preview."
  - "<green>/{label} reload <gray>- <aqua>Reloads the plugin configuration and control API."
  - "<green>/{label} help <gray>- <aqua>Shows this help message."

status-usage: "<red>Invalid arguments. Usage: /{label} status"
status:
  - "<gray>======== <green>Mine<aqua>CI<light_purple>CD <gray>========"
  - "<gray>Branch: <green>{branch}"
  - "<gray>Repository: <green>{remote}"
  - "<gray>Control API active: <green>{control-status}"
  - "<gray>Control API address: <green>{control-address}"
  - "<gray>Local changes: <green>{local-changes}"
  - "<gray>Changes on remote: <green>{remote-changes}"
  - "<gray>Approvals pending: <green>{approvals-pending}"
  - "<gray>=========================="

diff-usage: "<red>Invalid arguments. Usage: /{label} diff <local / remote>"
diff-failed: "<red>Error getting diff: {error}"
diff-local-header: "<gray>===== <green>Local changes <gray>====="
diff-remote-header: "<gray>===== <green>Remote changes <gray>===="
diff-line: "<gray>- <green>{change}"
diff-end: "<gray>======= End of diff ======"
diff-no-changes: "<green>No changes to display."

resolve-usage: "<red>Invalid arguments. Usage: /{label} resolve <merge-abort / repo-reset / reset-local-changes>"
resolve-failed-merge-abort: "<red>Error resolving via merge-abort: {error}"
resolve-failed-repo-reset: "<red>Error resolving via repo-reset: {error}"
resolve-failed-reset-local-changes: "<red>Error resolving via reset-local-changes: {error}"
resolve-success-merge-abort: "<green>Merge aborted successfully. Try proceeding with '/{label} pull'"
resolve-success-repo-reset: "<green>Repository reset successfully. Proceed with '/{label} pull'"
resolve-success-reset-local-changes: "<green>Local changes reset successfully."

init-failed-suggestion: "<red>Error initializing the repository: {error}\n<yellow>Tip: {suggestion}"
deinit-failed-suggestion: "<red>Error deinitializing the repository: {error}\n<yellow>Tip: {suggestion}"
pull-failed-suggestion: "<red>Error pulling repo: {error}\n<yellow>Tip: {suggestion}"
push-failed-suggestion: "<red>Error pushing repo: {error}\n<yellow>Tip: {suggestion}"
add-failed-suggestion: "<red>Error adding file(s): {error}\n<yellow>Tip: {suggestion}"
remove-failed-suggestion: "<red>Error removing file(s): {error}\n<yellow>Tip: {suggestion}"
reset-failed-suggestion: "<red>Error resetting: {error}\n<yellow>Tip: {suggestion}"
rollback-failed-suggestion: "<red>Error rolling back: {error}\n<yellow>Tip: {suggestion}"
revert-failed-suggestion: "<red>Error reverting: {error}\n<yellow>Tip: {suggestion}"
script-failed-suggestion: "<red>Error running script: {error}\n<yellow>Tip: {suggestion}"

health-check-failed: "<red>Health check failed after deploy: {error}"
auto-rolled-back: "<red>Health check failed - automatically rolled back the deploy."

approval-usage: "<red>Invalid arguments. Usage: /{label} confirm <approvalId> or /{label} cancel <approvalId>"
approval-created: "<green>Change preview (#{id}) pending approval: {count} change(s) coming from the remote. Confirm with '/{label} confirm {id}' or cancel with '/{label} cancel {id}' within {timeout}s."
approval-created-no-changes: "<yellow>Change preview (#{id}) pending approval: no changes detected. Confirm with '/{label} confirm {id}' or cancel with '/{label} cancel {id}' within {timeout}s."
approval-change: "<gray>- <green>{change}"
approval-confirm-hint: "<green>Confirm: /{label} confirm {id}  |  Cancel: /{label} cancel {id}"
approval-confirm-ok: "<green>Change preview #{id} confirmed. Applying changes..."
approval-cancel-ok: "<yellow>Change preview #{id} cancelled."
approval-not-found: "<red>No pending change preview with id {id}."

audit-empty: "<gray>No audit entries yet."
audit-line: "<gray>{when} <aqua>{actor}<gray>/<aqua>{source} <gray>{action} <green>{outcome}<gray> {detail}"
audit-end: "<gray>----- End of audit page {page} -----"
audit-failed: "<red>Unable to read audit log: {error}"

analytics-empty: "<gray>No analytics recorded yet."
analytics:
  - "<gray>======== <green>Analytics <gray>========"
  - "<gray>Deploys: <green>{deploys}"
  - "<gray>Successes: <green>{completed}"
  - "<gray>Failures: <green>{failed}"
  - "<gray>Rollbacks: <green>{rolledBack}"
  - "<gray>Success rate: <green>{successRate}%"
  - "<gray>Avg deploy time: <green>{avgMillis}ms"
  - "<gray>=========================="
analytics-reset-ok: "<green>Analytics data reset."

